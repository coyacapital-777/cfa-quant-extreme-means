[project]
name = "cfa-quant-extreme-means"
version = "0.1.0"
description = "CFA Level 1 Quant — Extreme Value Means with BA II Plus verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["cfa", "quant", "extreme-value", "robust-statistics", "finance"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/your-username/cfa-quant-extreme-means"
Repository = "https://github.com/your-username/cfa-quant-extreme-means"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfa_quant_extreme_means"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/cfa_quant_extreme_means --cov-report=term-missing"
